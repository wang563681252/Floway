services:
  server:
    image: floway-server:${FLOWAY_RELEASE:?set FLOWAY_RELEASE}
    environment:
      RUNTIME_LOCATION: ${FLOWAY_RUNTIME_LOCATION:-AZURE}
    ports: !override
      - "127.0.0.1:${FLOWAY_SERVER_PORT:-8788}:8788"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: floway-web:${FLOWAY_RELEASE:?set FLOWAY_RELEASE}
    ports: !override
      - "127.0.0.1:${FLOWAY_WEB_PORT:-18088}:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"